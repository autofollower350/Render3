<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JNVU Admit Card Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.card{

    width:100%;
    max-width:400px;

    background:#fff;

    padding:25px;

    border-radius:10px;

    box-shadow:0 2px 10px rgba(0,0,0,.1);

    text-align:center;
}

h2{
    color:#ff4b4b;
    margin-bottom:10px;
}

p{
    color:#666;
    font-size:14px;
    margin-bottom:20px;
}

input{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:6px;

    outline:none;

    font-size:16px;

    margin-bottom:15px;
}

button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:6px;

    background:#ff4b4b;

    color:#fff;

    font-size:16px;

    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.loader{

    display:none;

    margin-top:15px;

    color:#444;

    font-size:14px;
}

</style>
</head>

<body>

<div class="card">

    <h2>🚩 RajasthaniBoyz Portal</h2>

    <p>JNVU Admit Card Downloader</p>

    <form id="form" action="/download" method="POST">

        <input
            type="text"
            name="form_no"
            placeholder="Enter Form Number"
            required
            autocomplete="off"
        >

        <button id="btn" type="submit">
            🚀 Download Admit Card
        </button>

    </form>

    <div class="loader" id="loader">
        ⏳ Please wait...
    </div>

</div>

<script>

const form = document.getElementById('form');

const btn = document.getElementById('btn');

const loader = document.getElementById('loader');

form.addEventListener('submit', () => {

    btn.disabled = true;

    btn.innerHTML = 'Processing...';

    loader.style.display = 'block';
});

</script>

</body>
</html>
